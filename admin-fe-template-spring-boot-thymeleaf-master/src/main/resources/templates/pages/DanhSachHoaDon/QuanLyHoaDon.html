<!DOCTYPE html>
<html lang="en" layout:decorate="~{layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách hóa đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .pagination .page-item {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pagination .page-item .page-link {
            border-radius: 50%;
            width: 40px;
            height: 40px;
            text-align: center;
            line-height: 30px;
            color: #333;
            border: 1px solid #ddd;
            background-color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination .page-item.active .page-link {
            background-color: rgba(255, 165, 0, 0.3);
            border-color: rgba(255, 165, 0, 0.3);
            color: #ff7f00;
        }

        .pagination .page-item .page-link:hover {
            background-color: rgba(255, 165, 0, 0.1);
        }

        .pagination .page-item.disabled .page-link {
            color: #bbb;
            border-color: #eee;
            pointer-events: none;
            opacity: 0.5;
        }

        .table-hover tbody tr:hover {
            background-color: rgba(0, 123, 255, 0.1);
        }

        .nav-tabs .nav-link {
            border: 1px solid transparent;
            border-top-left-radius: 0.25rem;
            border-top-right-radius: 0.25rem;
            color: #495057;
        }

        .nav-tabs .nav-link.active {
            color: #495057;
            background-color: #fff;
            border-color: #dee2e6 #dee2e6 #fff;
        }

        .nav-tabs .nav-link:hover {
            border-color: #e9ecef #e9ecef #dee2e6;
        }

        .btn-outline-primary {
            border-color: #007bff;
            color: #007bff;
        }

        .btn-outline-primary:hover {
            background-color: #007bff;
            color: #fff;
        }

        .badge {
            font-size: 0.9em;
            padding: 0.5em 0.75em;
        }

        .badge.bg-warning {
            color: #000;
        }

        .badge.bg-info {
            color: #000;
        }

        .badge.bg-success {
            color: #fff;
        }

        .badge.bg-danger {
            color: #fff;
        }

        .badge.bg-secondary {
            color: #fff;
        }

        .badge.bg-dark {
            color: #fff;
        }

        .status-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            width: 100%;
            height: 30px; /* Đặt chiều cao cố định */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="container mt-4">
        <h4>Danh sách hóa đơn</h4>

        <!-- Bộ lọc và tìm kiếm -->
        <form method="get" action="/hoaDon/hien-thi">
            <div class="row mb-3">
                <div class="col-md-3">
                    <input type="text" class="form-control" name="maHoaDon"
                           placeholder="Mã hóa đơn" th:value="${maHoaDon}">
                </div>
                <div class="col-md-2">
                    <select class="form-select" name="trangThai">
                        <option value="">Tất cả</option>
                        <option value="0" th:selected="${trangThai == '0'}">Chờ xác nhận</option>
                        <option value="1" th:selected="${trangThai == '1'}">Đang vận chuyển</option>
                        <option value="2" th:selected="${trangThai == '2'}">Hoàn thành</option>
                        <option value="3" th:selected="${trangThai == '3'}">Đã hủy</option>
                        <option value="4" th:selected="${trangThai == '4'}">Trả hàng</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="date" class="form-control" name="fromDate" th:value="${fromDate}">
                </div>
                <div class="col-md-3">
                    <input type="date" class="form-control" name="toDate" th:value="${toDate}">
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
                </div>
            </div>
        </form>

        <!-- Tabs trạng thái -->
        <ul class="nav nav-tabs">
            <li class="nav-item"><a class="nav-link active" href="#">Tất cả</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Chờ xác nhận <span class="badge bg-danger">2</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#">Đang vận chuyển <span class="badge bg-danger">2</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#">Hoàn thành <span class="badge bg-danger">17</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#">Đã hủy <span class="badge bg-danger">7</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#">Trả hàng <span class="badge bg-danger">9</span></a></li>
        </ul>

        <!-- Bảng danh sách hóa đơn -->
        <table class="table table-hover mt-3">
            <thead class="table-light">
            <tr>
                <th>STT</th>
                <th>Mã</th>
                <th>Khách hàng</th>
                <th>Nhân viên</th>
                <th>SDT</th>
                <th>Tổng tiền</th>
                <th>Trạng thái</th>
                <th>Ngày tạo</th>
                <th>Loại đơn hàng</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="hd, i : ${listHoaDon}">
                <td th:text="${i.count}"></td>
                <td th:text="${hd.maHoaDon}"></td>
                <td th:text="${hd.khachHang.hoTen}"></td>
                <td th:text="${hd.nhanVien.hoTen}"></td>
                <td th:text="${hd.khachHang.sdt}"></td>

                <td th:text="${#numbers.formatDecimal(hd.tongTien, 0, 'COMMA', 2, 'POINT')} + ' đ'"></td>
                <td th:switch="${hd.trangThai}">
                    <span th:case="0" class="status-card badge bg-warning text-dark">Chờ xác nhận</span>
                    <span th:case="1" class="status-card badge bg-info text-dark" >Đang vận chuyển</span>
                    <span th:case="2" class="status-card badge bg-success" >Hoàn thành</span>
                    <span th:case="3" class="status-card badge bg-danger" >Đã hủy</span>
                    <span th:case="4" class="status-card badge bg-secondary" >Trả hàng</span>
                    <span th:case="*" class="status-card badge bg-dark" >Không xác định</span>
                </td>
                <td th:text="${hd.ngayTao}"></td>
                <td>
                    <span th:class="${hd.loaiHoaDon} ? 'status-card badge bg-success' : 'status-card badge bg-danger'"
                          th:text="${hd.loaiHoaDon} ? 'Online' : 'Tại quầy'">
                    </span>
                </td>
                <td>
                    <a th:href="@{|/hoaDon/detail/*{hd.id}|}">
                        <button class="btn btn-sm btn-outline-primary" title="chi tiết">📄</button>
                    </a>
                    <button class="btn btn-sm btn-outline-primary" title="In hóa đơn">🖨️</button>
                </td>
            </tr>
            </tbody>
        </table>
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/hoaDon/hien-thi(page=${currentPage - 1}, size=${size},
                                           maHoaDon=${maHoaDon}, trangThai=${trangThai},
                                           fromDate=${fromDate}, toDate=${toDate})}">
                        &lt;
                    </a>
                </li>
                <li th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                    class="page-item"
                    th:classappend="${pageNum == currentPage} ? 'active'">
                    <a class="page-link"
                       th:href="@{/hoaDon/hien-thi(page=${pageNum}, size=${size},
                                           maHoaDon=${maHoaDon}, trangThai=${trangThai},
                                           fromDate=${fromDate}, toDate=${toDate})}"
                       th:text="${pageNum + 1}">
                    </a>
                </li>
                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/hoaDon/hien-thi(page=${currentPage + 1}, size=${size},
                                           maHoaDon=${maHoaDon}, trangThai=${trangThai},
                                           fromDate=${fromDate}, toDate=${toDate})}">
                        &gt;
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</section>
</body>
</html>
