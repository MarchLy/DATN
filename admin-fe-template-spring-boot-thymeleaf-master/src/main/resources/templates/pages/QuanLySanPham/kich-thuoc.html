<!DOCTYPE html>
<html lang="en" layout:decorate="~{layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sản Phẩm</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>


        .table th, .table td {
            vertical-align: middle;
        }

        .custom-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .custom-card-header {
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }

        .custom-card-body {
            padding: 2rem;
        }

        .custom-input-group {
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .custom-input-group input {
            border: 1px solid #ced4da;
            box-shadow: none;
        }

        .custom-input-group .input-group-append .btn {
            border: none;
            background-color: #6f42c1;
            color: white;
        }

        .custom-select {
            border-radius: 0.5rem;
            width: 100%;
        }

        .input-group {
            border-radius: 5px !important;
            overflow: hidden;
        }

        .input-group .form-control {
            border-radius: 5px !important;
        }

        .pagination {
            display: flex;
            gap: 10px; /* Khoảng cách giữa các nút */
        }

        .pagination .page-item {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pagination .page-item .page-link {
            border-radius: 50%; /* Bo tròn nút */
            width: 40px;
            height: 40px;
            text-align: center;
            line-height: 30px;
            color: #333; /* Màu chữ */
            border: 1px solid #ddd; /* Viền nhạt */
            background-color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination .page-item.active .page-link {
            background-color: rgba(255, 165, 0, 0.3); /* Màu cam nhạt */
            border-color: rgba(255, 165, 0, 0.3);
            color: #ff7f00;
        }

        .pagination .page-item .page-link:hover {
            background-color: rgba(255, 165, 0, 0.1); /* Màu hover */
        }

        .pagination .page-item.disabled .page-link {
            color: #bbb;
            border-color: #eee;
            pointer-events: none;
            opacity: 0.5;
        }

    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="container-fluid">
        <div class="card custom-card">
            <div class="card-header custom-card-header text-center">
                <h1 class="mb-0">QUẢN LÝ KÍCH THƯỚC</h1>
            </div>
            <div class="card-body custom-card-body">
                <div class="mb-4">
                    <label for="search" class="font-weight-bold">Tên Kích thước</label>
                    <div class="d-flex align-items-center">
                        <div class="input-group custom-input-group mb-3" style="max-width: 600px; margin-right: 50px">
                            <input id="search" type="text" class="form-control"
                                   placeholder="Tìm kiếm kích thước theo tên..."
                                   style="border: 1px solid black; border-radius: 5px;">
                        </div>
                        <button class="btn btn-purple ml-2 mb-3" style="background-color: #6f42c1; color: white;"><i
                                class="fas fa-plus"></i> Thêm Kích thước
                        </button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered text-center">
                        <thead class="thead-light">
                        <tr>
                            <th>#</th>
                            <th>Mã</th>
                            <th>Tên</th>
                            <th>Chức năng</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="kt, i : ${listKichThuoc}">
                            <td th:text="${i.index+1}"></td>
                            <td th:text="${kt.maMauSac}"></td>
                            <td th:text="${m.tenMauSac}"></td>
                            <td>
                                <a th:href="@{/mau-sac/detail/*{m.id}}"><i
                                        class="fas fa-edit text-primary cursor-pointer"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center">
                    <!-- Nút "Trước" -->
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/mau-sac/hien-thi(page=${currentPage - 1}, size=5)}">
                            &lt;
                        </a>
                    </li>

                    <!-- Hiển thị các trang -->
                    <li th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                        class="page-item"
                        th:classappend="${pageNum == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/mau-sac/hien-thi(page=${pageNum}, size=5)}"
                           th:text="${pageNum + 1}"></a>
                    </li>

                    <!-- Nút "Tiếp" -->
                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/mau-sac/hien-thi(page=${currentPage + 1}, size=5)}">
                            &gt;
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</section>

</body>
</html>
